# The engine project (separate from the live app's project). The serving
# endpoint authenticates with DHQ Connect keys itself, so the gateway JWT
# check must stay off — same reason as the app's supabase/config.toml.
project_id = "hovnqztlbsgsywrbidbh"

[functions.dhq-tools]
verify_jwt = false

[functions.dhq-auth]
verify_jwt = false

# Queues Sleeper league ids for the engine server; grants nothing.
[functions.dhq-request]
verify_jwt = false

# One league's built numbers (public Sleeper-league data); grants nothing.
[functions.dhq-league]
verify_jwt = false

# Values for a league a page gathered (Phase A6); grants nothing.
[functions.dhq-compute]
verify_jwt = false

# The mock draft's computer picks (Phase A7); grants nothing.
[functions.dhq-mock]
verify_jwt = false
