# Publishes the site to Cloudflare Pages, in parallel with GitHub Pages.
#
# It takes the exact artifact "Deploy to GitHub Pages" (deploy.yml) built
# (the "github-pages" artifact: precompiled pages, version.json and all) and
# uploads it to a Cloudflare Pages project, so both hosts serve the same
# build. deploy.yml is not changed.
#
# Off until the repo has BOTH secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID: without them the run only prints a notice and
# deploys nothing. Optional repo variable CLOUDFLARE_PAGES_PROJECT overrides
# the project name below (the name is also the <name>.pages.dev address).
name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id of the 'Deploy to GitHub Pages' run to publish (blank = newest one with an artifact; artifacts last 1 day)"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    # A failed GitHub Pages step still leaves the built artifact behind (that is
    # the point once the repo is private), so only a cancelled build is skipped.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    env:
      CF_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'dhq-app' }}
    steps:
      - name: Cloudflare not set up
        if: env.CF_READY != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set; nothing was deployed to Cloudflare."

      - name: Find the build
        if: env.CF_READY == 'true'
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=github-pages&per_page=30" \
              --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0].workflow_run.id // empty')
          fi
          [ -n "$RUN_ID" ] || { echo "No unexpired github-pages artifact. Re-run 'Deploy to GitHub Pages' first." >&2; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)" >> "$GITHUB_OUTPUT"

      - name: Download the built artifact
        if: env.CF_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.build.outputs.run_id }}" -R "$GITHUB_REPOSITORY" -n github-pages -D artifact
          mkdir -p site
          tar -xf artifact/artifact.tar -C site
          [ -f site/index.html ] && [ -f site/version.json ] || { echo "Artifact is missing index.html or version.json" >&2; exit 1; }
          # GitHub Pages answers an unknown path with a 404. Cloudflare Pages,
          # when a site has no 404.html, answers it with index.html and a 200,
          # which would turn a missing script or data file into HTML.
          [ -f site/404.html ] || printf '<!doctype html><meta charset="utf-8"><title>Not found</title><p>Page not found. <a href="/">War Room</a></p>\n' > site/404.html

      - name: Check out the build's scripts
        if: env.CF_READY == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.build.outputs.sha }}
          path: src

      - name: Deploy to Cloudflare Pages
        if: env.CF_READY == 'true'
        id: cf
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.150.0"
          # First run creates the project; afterwards this fails harmlessly.
          preCommands: wrangler pages project create ${{ env.CF_PROJECT }} --production-branch=main || true
          command: pages deploy site --project-name=${{ env.CF_PROJECT }} --branch=main --commit-hash=${{ steps.build.outputs.sha }} --commit-dirty=true

      # Same check deploy.yml runs against the GitHub Pages URL, pointed at this
      # Cloudflare deployment's own address.
      - name: Verify the Cloudflare deploy
        if: env.CF_READY == 'true'
        run: node src/scripts/verify-deploy.cjs --url "${{ steps.cf.outputs.deployment-url }}" --expect site/version.json --timeout 300 --interval 15
