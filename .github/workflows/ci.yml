name: CI
# Pushes to main and pull requests (a branch with a pull request was tested
# twice: Phase B2, 2026-10-29, build minutes).
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint . --ext .js
      - run: node tests/run.js
